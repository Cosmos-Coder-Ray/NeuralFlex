model:
  vocab_size: 1024
  hidden_size: 256
  num_layers: 4
  max_position_embeddings: 256
  intermediate_size: 768
  rms_norm_eps: 1.0e-5
  dropout: 0.0
  attention:
    num_heads: 8
    num_kv_heads: 2
    head_dim: 32
    rope_theta: 10000.0
train:
  train_path: data/tiny_overfit.txt
  train_format: txt
  output_dir: artifacts/dense_overfit
  sequence_length: 128
  batch_size: 8
  max_steps: 1200
  grad_accum_steps: 2
  learning_rate: 0.0005
  min_learning_rate: 0.0001
  warmup_steps: 20
  weight_decay: 0.01
  grad_clip_norm: 1.0
  precision: bf16
  seed: 42
  log_every: 10
  save_every: 200
  shuffle_buffer_size: 128
